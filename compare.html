<h1>資格を比較</h1>
<p>気になる資格を候補に保存し、2〜3件の受験料や受験条件を並べて比較できます。候補はこのブラウザに保存されます。</p>
<section class="comparison-presets" aria-labelledby="comparison-presets-title">
<h2 id="comparison-presets-title">比較例から選ぶ</h2>
<p class="comparison-preset-note">ここにある2組は比較の例です。</p>
<div class="comparison-preset-list">
<button type="button" data-compare="boki3.html,mos-excel.html"><strong>事務の仕事（2資格）</strong><span>日商簿記3級・MOS Excelを比較する</span></button>
<button type="button" data-compare="takken.html,kanrigyomu.html,chintai.html"><strong>不動産の仕事（3資格）</strong><span>宅建・管理業務主任者・賃貸不動産経営管理士を比較する</span></button>
</div>
<p>比較例を選んでも、以前保存した候補は削除されません。</p>
</section>
<form id="candidate-form"><label for="candidate-select">資格を選ぶ</label>
<select id="candidate-select" required></select>
<button>候補に追加</button></form>
<p id="candidate-status" role="status"></p>
<fieldset id="candidate-list" hidden><legend>比較する資格を2〜3件選ぶ</legend></fieldset>
<p id="comparison-status" role="status"></p>
<p class="comparison-scroll-hint" hidden>比較表は横にスクロールできます。</p>
<div id="comparison" role="region" tabindex="0" aria-label="資格比較表。横にスクロールできます" hidden></div>
</main>
